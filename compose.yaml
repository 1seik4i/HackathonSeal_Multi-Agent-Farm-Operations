services:
  farmops-ai:
    build: .
    container_name: farmops-ai-team-2
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/farmops.db
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - farmops-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  farmops-data:
